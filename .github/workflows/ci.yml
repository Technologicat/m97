# Install dependencies, lint, and run the test suite across the supported Python versions;
# on a version tag (vX.Y.Z), build the sdist and wheel and publish to PyPI via trusted publishing.
#
# Linux only: m97 reads amdgpu sensors from sysfs, runs podman and asks NetworkManager which network the
# machine is on, so it has no meaningful run on macOS or Windows. CPython only: PyPy is not a target for a
# NiceGUI app whose dependencies (pydantic-core, orjson) are compiled extensions.

name: CI

on:
  push:
    branches: [ main ]
    tags: ["v*"]           # a version tag triggers the publish job
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        # Lets a Python at alpha/beta/rc resolve: the setup-python manifest marks
        # prereleases unstable, so without this a bare version such as "3.16" resolves
        # to nothing. A no-op wherever a stable release exists, so it stays in for good
        # rather than being added and removed around each new Python.
        allow-prereleases: true
    - name: Install PDM
      run: |
        python -m pip install --upgrade pip
        pip install pdm
    - name: Create in-project virtualenv and install dependencies
      run: |
        # Point PDM at the interpreter `setup-python` already installed, rather than
        # letting it fetch a second one — its index has no prerelease build, so asking
        # for a version like "3.15" fails while that very interpreter is on PATH.
        pdm use -f "$(python -c 'import sys; print(sys.executable)')"
        pdm install
    - name: Lint with ruff
      run: pdm run ruff check . --ignore SIM103
    - name: Lint advisories (non-blocking)
      run: pdm run ruff check . --select SIM103 || true
    # Continuation-line indentation, which ruff does not implement. The E12 codes the house keeps, listed
    # one by one: given `--select`, pycodestyle disregards `--ignore`, so E126 and E127 cannot be dropped
    # from a wider selection. The excludes are ruff's.
    - name: Lint continuation lines with pycodestyle
      run: pdm run python -m pycodestyle --select=E121,E122,E123,E124,E125,E128,E129,E131 --exclude=.git,__pycache__,build,dist,.venv,00_stuff,lint_canary_fixture.py .
    - name: Check that the linters still catch what we rely on
      run: pdm run python scripts/check_lint_canary.py
    - name: Run tests
      run: pdm run pytest tests/ -v

  build-dist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-dist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # OpenID Connect token for PyPI trusted publishing (no API token)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
